<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter 14 - Nested If Statements</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: #1e293b;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            text-align: center;
            max-width: 480px;
            width: 100%;
        }

        h1 {
            color: #38bdf8;
            margin-bottom: 10px;
            font-size: 24px;
        }

        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        button {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 10px 15px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
        }

        button:hover {
            background-color: #0ea5e9;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Chapter 14: Nested If Statements</h1>
        <p>Har button par click karke nested conditions ka output check karein:</p>

        <div class="button-group">
            <button onclick="runNestedIf()">1. Basic Nested If (Score & Grade)</button>
            <button onclick="runAdvancedNestedIf()">2. Advanced Nested If (Login & Role)</button>
        </div>
    </div>

    <!-- Linking JavaScript File -->
    <script src="app14.js"></script>
</body>
</html>
